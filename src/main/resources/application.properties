# Server Configuration (auto-selected by LeaveManagementApplication to prevent port collisions)
# server.port defaults to 8081, with automatic fallback to 8082 if occupied

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:leavedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Secret Key
jwt.secret=MySecretKeyForJWTTokenGenerationEmployeeLeaveManagementSystem2024
jwt.expiration=86400000

# Application Name
spring.application.name=Employee Leave Management System
